[project]
name = "asistente"
version = "0.1.0"
description = "Asistente con memoria de tres niveles, RAG sobre el Codigo Nacional de Transito y servidor MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0",
    # Se fija la version 1.x a proposito: en mcp 2.x FastMCP paso a llamarse
    # MCPServer y la API cambio. El tutorial del reto usa la 1.x.
    "mcp[cli]>=1.2,<2",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
]

[project.scripts]
asistente = "asistente.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
